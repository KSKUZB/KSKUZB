<style>
/* Layout: sticky top bar (language + light/dark), hero with a live position-size calculator, two course cards, payment steps, FAQ.

:root {

* { box-sizing: border-box; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }

/* narrow views */

function shrink(f) {

    im.onload = () => {

function simRun(p, risk, keep) {
  const N = 2000, r = risk / 100, w = p.wr / 100, fin = [], dds = [], paths = [];

    let b = 1, peak = 1, dd = 0, hit = false; const path = s < keep ? [1] : null;
    for (let i = 0; i < p.n; i++) {
      b *= Math.random() < w ? 1 + r * p.rr : 1 - r;
      if (b > peak) peak = b; const d = 1 - b / peak; if (d > dd) dd = d;

    if (hit) ruin++; if (b > 1) prof++; fin.push(b); dds.push(dd); if (path) paths.push(path);
  }
  fin.sort((a, b) => a - b); dds.sort((a, b) => a - b);
  return { ruin: ruin / N, prof: prof / N, med: fin[N >> 1], dd: dds[N >> 1], paths };
}

    x.font = "11px " + col("--font-mono"); x.lineWidth = 1;
    [[1, ts("start")], [0.5, "−50%"], [2, "×2"]].forEach(([b, lb]) => {
      x.setLineDash(b === 0.5 ? [4, 4] : []); x.beginPath(); x.moveTo(PL, Y(b)); x.lineTo(W - PR, Y(b));
      x.strokeStyle = b === 0.5 ? col("--bad") : col("--line"); x.stroke(); x.fillStyle = col("--muted"); x.fillText(lb, W - PR + 4, Y(b) + 4);
    });
    x.setLineDash([]); x.lineWidth = 1.2;
    paths.forEach(p => { x.beginPath(); p.forEach((b, i) => (i ? x.lineTo(X(i), Y(b)) : x.moveTo(X(i), Y(b)))); x.strokeStyle = p[p.length - 1] >= 1 ? col("--good") : col("--bad"); x.globalAlpha = 0.3; x.stroke(); });
    x.globalAlpha = 1; x.lineWidth = 2.4; x.beginPath(); medPath.forEach((b, i) => (i ? x.lineTo(X(i), Y(b)) : x.moveTo(X(i), Y(b)))); x.strokeStyle = col("--fg"); x.stroke();
  }

    read();

    last = a; paths = a.paths; medPath = paths[0].map((_, i) => { const v = paths.map(p => p[i]).sort((u, w) => u - w); return v[v.length >> 1]; });
    const stat = (k, v, c) => '<div><div class="hint">' + ts(k) + '</div><div class="num" style="font-size:1.5rem;' + (c ? 'color:var(' + c + ')' : '') + '">' + v + '</div></div>';
    g("s-out").innerHTML =
      '<div class="grid2">' + stat("ruin", pc(a.ruin), a.ruin > 0.2 ? "--bad" : a.ruin > 0.05 ? "--warn" : "--good") + stat("prof", pc(a.prof)) + '</div>' +
      '<div class="grid2">' + stat("med", usd(SIM.bal * a.med)) + stat("dd", pc(a.dd)) + '</div>' +
      '<div><div class="hint" style="margin-bottom:6px">' + ts("chart") + '</div><div style="position:relative;height:240px"><canvas id="s-cv" style="position:absolute;inset:0;width:100%;height:100%"></canvas></div></div>' +
      '<p class="notice">' + ts("ev") + ': <b class="num">' + (ev >= 0 ? "+" : "") + ev.toFixed(2) + ' R</b>. ' + (ev < 0 ? ts("neg") : ts("pos")) + '</p>' +
      '<div class="card" style="display:grid;gap:8px"><h3>' + ts("cmp") + '</h3><div class="grid2">' + stat("cmpR", pc(b.ruin), "--good") + stat("cmpP", pc(b.prof)) + '</div></div>' +
      '<div class="card" style="display:grid;gap:12px"><p>' + ts("cta") + '</p><div class="cta"><a class="btn" href="#pay-risk">' + ts("btn") + '</a><button class="btn ghost" id="s-share">' + ts("share") + '</button></div></div>';
    draw();
    g("s-share").onclick = () => {
      const bt = g("s-share"), txt = ts("shareTxt").replace("{n}", SIM.n).replace("{p}", pc(last.ruin)) + " " + location.href.split("#")[0] + "#sim";

    };
  }
  g("s-run").onclick = run;

function bindGame() {
  const g = id => document.getElementById(id);
  const draw = () => {
    const box = g("g-body"); if (!box) return;
    box.innerHTML = G.err && !G.ok ? '<p class="err">' + tg("err") + '</p>' : gBody();
    const act = async (fn, errMsg) => { G.msg = ""; try { const r = await fn(); if (r && r.error) throw r.error; await loadGame(); } catch (e) { console.error(e); G.msg = errMsg; } draw(); };
    const lg = g("g-login"); if (lg) lg.onclick = e => { e.preventDefault(); next = "game"; authMode = "reg"; go("auth"); };
    box.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
      if (!S.user) { next = "game"; authMode = "reg"; go("auth"); return; }
      b.disabled = true; act(() => SB.from("predictions").upsert({ user_id: S.user.id, event_id: b.dataset.ev, pick: b.dataset.pick }, { onConflict: "user_id,event_id" }), tg("closed"));
    });
    box.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { G.tab = b.dataset.tab; draw(); });
    box.querySelectorAll("[data-res]").forEach(b => b.onclick = () => act(() => SB.from("events").update({ result: b.dataset.res }).eq("id", b.dataset.ev), tg("save_err")));
    box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => act(() => SB.from("events").delete().eq("id", b.dataset.del), tg("save_err")));
    const add = g("a-add");
    if (add) add.onclick = () => {
      const title = g("a-title").value.trim(), w = new Date(g("a-when").value);
      if (!title || isNaN(w)) { G.msg = tg("adm_bad"); draw(); return; }
      act(() => SB.from("events").insert({ kind: g("a-kind").value, title, starts_at: w.toISOString() }), tg("save_err"));
    };
    const imp = g("a-imp");
    if (imp) imp.onclick = () => {
      const have = new Set(G.events.map(e => e.kind + gTime(e)));
      const rows = EVENTS.map(e => ({ k: e.k.toUpperCase(), at: evAt(e) })).filter(x => x.at.getTime() > Date.now() && !have.has(x.k + x.at.getTime()))
        .map(x => ({ kind: x.k, title: x.k + " · " + fmtEv(x.at).date, starts_at: x.at.toISOString() }));
      if (rows.length) act(() => SB.from("events").insert(rows), tg("save_err"));
    };
  };
  draw();
  loadGame().then(draw);
  newsTimer = setInterval(() => {
    document.querySelectorAll("[data-cd]").forEach(el => { const ms = +el.dataset.cd - Date.now(); if (ms <= 0) { clearInterval(newsTimer); newsTimer = null; loadGame().then(draw); } else el.textContent = cdText(ms); });
  }, 1000);
}

    '<section class="homehead"><div class="eyebrow">' + t("eyebrow") + '</div><h1>' + t("cur_t") + '</h1><p class="sub">' + t("cur_s") + '</p></section>' +
    '<section id="courses" class="courses">' + COURSES.map(courseCard).join("") + '</section>' +
    '<a class="gl simpromo" href="#sim"><div><div class="eyebrow">' + ts("ey") + '</div><strong>' + ts("t") + '</strong><p class="hint">' + ts("sub") + '</p></div><span class="btn ghost sm">→</span></a>' + gamePromo() +
    '<section class="block" style="margin-top:36px"><h2 style="margin-bottom:18px">' + t("faq_t") + '</h2>' +
      [1, 2, 3].map(n => '<details><summary>' + t("q" + n) + '</summary><p>' + t("a" + n) + '</p></details>').join("") + '</section>';
}

/* ---------- router ---------- */
function footer() {
  return '<footer><div class="soc">' +
    '<a href="' + TG + '" target="_blank" rel="noopener noreferrer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 3.5 2.8 10.7l5.6 2.1 2.2 6.7 3.3-4 4.7 3.6z"/><path d="m8.4 12.8 9.3-6.6"/></svg>Telegram</a>' +
    '<a href="' + IG + '" target="_blank" rel="noopener noreferrer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.9" fill="currentColor" stroke="none"/></svg>Instagram</a><a href="#support"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>' + t("sup_btn") + '</a></div>' +
    '<p class="hint"><a href="#terms">' + t("lg_terms_t") + '</a> · <a href="#privacy">' + t("lg_priv_t") + '</a></p><p class="risk">' + t("disc") + '</p><div class="row" style="align-items:center"><span>© KSKUZB</span><span class="author">Kadirov Sultonbek</span></div></footer>';
}
function render() {
  const h = location.hash.slice(1), app = document.getElementById("app");
  const parts = h.split("-"), name = parts[0], c = parts[1] ? course(parts[1]) : null;
  CH.active = false; if (CH.ro) { CH.ro.disconnect(); CH.ro = null; }
  if (newsTimer) { clearInterval(newsTimer); newsTimer = null; }
  applyTheme(); header();
  if (name === "auth") { app.innerHTML = auth() + footer(); bindAuth(); }
  else if ((name === "pay" || name === "learn") && c && !isOpen(c.id)) { app.innerHTML = soonView(c) + footer(); }
  else if (name === "pay" && c) {
    if (!user()) { next = h; authMode = "reg"; go("auth"); return; }
    app.innerHTML = pay(c) + footer(); bindPay(c);
  }
  else if (name === "learn" && c) {
    if (lastCourse !== c.id) {
      const n = titles(c.id).length, pg = prog(c.id); let k = 0;
      if (hasAccess(c.id)) { while (k < n && pg.includes(k)) k++; if (k >= n) k = 0; }
      cur = k; lastCourse = c.id;
    }
    app.innerHTML = learn(c) + footer(); bindLearn(c);
  }
  else if (name === "learn") { app.innerHTML = myCourses() + footer(); }
  else if (name === "support") {
    if (!user()) { next = "support"; authMode = "reg"; go("auth"); return; }
    app.innerHTML = support() + footer(); bindSupport();
  }
  else if (name === "terms" || name === "privacy") { app.innerHTML = legal(name) + footer(); }
  else if (name === "newpass") {
    if (!user()) { authMode = "login"; go("auth"); return; }
    app.innerHTML = newPass() + footer(); bindNewPass();
  }
  else if (name === "game") { app.innerHTML = gameView() + footer(); bindGame(); }
  else if (name === "sim") { app.innerHTML = simView() + footer(); bindSim(); }
  else if (name === "tools") { app.innerHTML = toolsView() + footer(); bindTools(); }
  else if (name === "main") { app.innerHTML = newsView() + gamePromo() + footer(); bindNews(); }
  else if (name === "chart") { app.innerHTML = chartView() + footer(); bindChart(); }
  else if (name === "admin") {
    if (!user()) { authMode = "login"; next = "admin"; go("auth"); return; }
    app.innerHTML = (isAdmin() ? admin() : noAccess()) + footer();
    if (isAdmin()) bindAdmin();
  }
  else {
    app.innerHTML = homeView() + footer();
  }
  document.documentElement.lang = lang;
}
window.addEventListener("hashchange", () => {
  render(); refresh();
  if (pending) { const el = document.getElementById(pending); pending = ""; if (el) el.scrollIntoView({ behavior: "smooth" }); }
  else window.scrollTo(0, 0);
});
async function init() {
  const app = document.getElementById("app");
  applyTheme();
  if (!SB) { header(); app.innerHTML = '<div class="narrow"><p class="notice">Sayt hali sozlanmagan: config.js fayliga Supabase manzili va kalitini yozing (README, 3-qadam).</p></div>'; return; }
  app.innerHTML = '<div class="narrow"><p class="hint">…</p></div>';
  const hh = location.hash, rec = /type=recovery/.test(hh), bad = /error_code=|error=access_denied/.test(hh);
  try { await loadAll(); } catch (e) { console.error(e); }
  if (rec && S.user) history.replaceState(null, "", "#newpass");
  else if (rec || bad) { authMode = "login"; authError = t("e_expired"); history.replaceState(null, "", "#auth"); }
  SB.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && S.user) { resetS(); render(); } });
  render();
}
init();
</script>
</body>
</html>
